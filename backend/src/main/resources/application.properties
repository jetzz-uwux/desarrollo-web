spring.application.name=booknest
server.port=8081
##-----
spring.datasource.url=jdbc:postgresql://localhost:5432/booknest
spring.datasource.username=booknest_user
spring.datasource.password=8462
spring.jpa.hibernate.ddl-auto=none
# Dado que Spring solo permite subir archivos de maximo 1MB estas dos lineas permiten subir PDFs de hasta 50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
## Muestra mensajes de error
server.error.include-message=always