<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Series literarias</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <h1>📚 BookNest</h1>
            <nav aria-label="Navegación principal">
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/index.html} + '#seccion-resenas'">Reseñas</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/index.html} + '#seccion-ratings'">Calificaciones</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/index.html} + '#seccion-estadisticas'">Estadísticas</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/index.html} + '#seccion-libros'">Libros</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/index.html} + '#seccion-series'">Series</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/index.html} + '#seccion-archivos'">Archivos</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none"  th:href="@{/catalogo}">Catálogo</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" aria-current="page" th:href="@{/catalogo/series}">Lista de series</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/colecciones.html}">Colecciones</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/perfil.html}">Perfil</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" th:href="@{/login.html}">Login / Registro</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <h2 class="mt-1">Series literarias</h2>

        <p th:if="${#lists.isEmpty(series)}">No hay series registradas.</p>

        <div class="table-responsive" th:unless="${#lists.isEmpty(series)}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="serie : ${series}">
                        <td th:text="${serie.id}"></td>
                        <td>
                            <a th:href="@{/catalogo/series/{id}(id=${serie.id})}"
                            th:text="${serie.name}">
                                Nombre de la serie
                            </a>
                        </td>                    
                        <td th:text="${serie.seriesType}"></td>
                        <td>
                            <button type="button" class="btn btn-outline js-editar-serie"
                                th:attr="data-id=${serie.id},data-name=${serie.name},data-type=${serie.seriesType}">Editar</button>
                            <button type="button" class="btn btn-outline js-eliminar-serie"
                                th:attr="data-id=${serie.id},data-name=${serie.name}">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <section class="card mt-1" id="serie-editar-panel" hidden>
            <h3>Editar serie</h3>
            <form id="serie-editar-form">
                <input type="hidden" id="serie-editar-id">
                <div class="form-group"><label for="serie-editar-nombre">Nombre</label>
                    <input id="serie-editar-nombre" required maxlength="255"></div>
                <div class="form-group"><label for="serie-editar-tipo">Tipo</label>
                    <select id="serie-editar-tipo" required>
                        <option value="bilogia">Bilogía</option><option value="trilogia">Trilogía</option>
                        <option value="saga">Saga</option>
                    </select></div>
                <button type="submit" class="btn btn-primary">Guardar serie</button>
                <button type="button" id="serie-cancelar" class="btn btn-outline">Cancelar</button>
            </form>
        </section>
        <p id="serie-lista-mensaje" role="status" aria-live="polite"></p>
    </main>
    <script th:src="@{/js/series-acciones.js}"></script>

</body>
</html>
