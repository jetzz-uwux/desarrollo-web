<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Series literarias</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/catalogo-ui.css}">
</head>
<body>

    <header class="navbar catalogo-navbar">
        <div class="container nav-content">
            <h1>📚 BookNest</h1>
            <nav class="catalogo-nav-links" aria-label="Navegación principal">
                <a class="btn btn-outline" th:href="@{/}">Inicio</a>
                <a class="btn btn-outline" th:href="@{/catalogo}">Catálogo</a>
                <a class="btn btn-outline" th:href="@{/catalogo/series}" aria-current="page">Series</a>
                <a class="btn btn-outline" th:href="@{/#seccion-libros}">Agregar libro</a>
                <a class="btn btn-outline" th:href="@{/#seccion-resenas}">Reseñas</a>
                <a class="btn btn-outline" th:href="@{/#seccion-ratings}">Calificaciones</a>
                <a class="btn btn-outline" th:href="@{/#seccion-estadisticas}">Estadísticas</a>
                <a class="btn btn-outline" th:href="@{/colecciones.html}">Colecciones</a>
                <a class="btn btn-outline" th:href="@{/perfil.html}">Perfil</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <h2 class="mt-1">Series literarias</h2>

        <p th:if="${#lists.isEmpty(series)}">No hay series registradas.</p>

        <div class="table-responsive" th:unless="${#lists.isEmpty(series)}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="serie : ${series}">
                        <td th:text="${serie.id}"></td>
                        <td>
                            <a th:href="@{/catalogo/series/{id}(id=${serie.id})}"
                            th:text="${serie.name}">
                                Nombre de la serie
                            </a>
                        </td>                    
                        <td th:text="${serie.seriesType}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
