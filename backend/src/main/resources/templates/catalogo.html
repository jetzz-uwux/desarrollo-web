<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Catálogo de libros</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <h1>📚 BookNest</h1>
            <nav>
                <a class="btn btn-outline" th:href="@{/catalogo}">Catálogo</a>
                <a class="btn btn-outline" th:href="@{/catalogo/series}">Series</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <h2>Catálogo de libros</h2>
        <p>Explora y busca los libros disponibles en BookNest.</p>

        <!-- Formulario de búsqueda -->
        <article class="card mt-1">
            <form method="get" th:action="@{/catalogo}">

                <div class="form-group">
                    <label for="q">Buscar por título:</label>
                    <input type="text" id="q" name="q" th:value="${q}"
                           placeholder="Escribe un título">
                </div>

                <div class="form-group">
                    <label for="minPages">Páginas mínimas:</label>
                    <input type="number" id="minPages" name="minPages" min="0"
                           th:value="${minPages}">
                </div>

                <div class="form-group">
                    <label for="maxPages">Páginas máximas:</label>
                    <input type="number" id="maxPages" name="maxPages" min="0"
                           th:value="${maxPages}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <a class="btn btn-outline" th:href="@{/catalogo}">Limpiar filtros</a>
                </div>

            </form>
        </article>

        <h3 class="mt-1">Libros disponibles</h3>

        <!-- Mensaje cuando no hay resultados -->
        <p th:if="${#lists.isEmpty(libros)}">No se encontraron libros.</p>

        <!-- Tabla de libros -->
        <div class="table-responsive" th:unless="${#lists.isEmpty(libros)}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Páginas</th>
                        <th>Sinopsis</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="libro : ${libros}">
                        <td th:text="${libro.id}"></td>
                        <td>
                            <a th:href="@{/catalogo/libros/{id}(id=${libro.id})}"
                               th:text="${libro.mainTitle}"></a>
                        </td>
                        <td th:text="${libro.totalPages}"></td>
                        <td th:text="${libro.synopsis}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
