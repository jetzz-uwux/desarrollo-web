<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Login y Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/loginScript.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <h1>📚 BookNest</h1>
            <nav aria-label="Navegación principal">
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/index.html#seccion-resenas">Reseñas</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/index.html#seccion-ratings">Calificaciones</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/index.html#seccion-estadisticas">Estadísticas</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/index.html#seccion-libros">Libros</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/index.html#seccion-series">Series</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/index.html#seccion-archivos">Archivos</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/catalogo">Catálogo</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/catalogo/series">Lista de series</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/colecciones.html">Colecciones</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/perfil.html">Perfil</a>
                <a class="nav-btn" style="display:inline-block;text-decoration:none" href="/login.html">Login / Registro</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="mensaje" class="alert hidden"></div>

        <div class="grid-layout-equal">
            <section class="card">
                <h2>Iniciar sesión</h2>

                <div class="form-group mt-1">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-primary" onclick="iniciarSesion()">Login</button>
                </div>
            </section>

            <section class="card">
                <h2>Registrar nuevo usuario</h2>

                <div class="form-group mt-1">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-primary" onclick="crearUsuario()">Registrar</button>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
